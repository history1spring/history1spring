/* Major transitions follow the colored cells in the source cue sheet. */
.schedule-row.milestone{background:var(--event-tint);--event-color:#203f65;--event-tint:#edf4fb}
.schedule-row.milestone-opening{--event-color:#694393;--event-tint:#f4effa}
.schedule-row.milestone-teams{--event-color:#16707b;--event-tint:#edf7f7}
.schedule-row.milestone-round{--event-color:#203f65;--event-tint:#edf4fb}
.schedule-row.milestone-break{--event-color:#ad5a00;--event-tint:#fff2dc}
.schedule-row.milestone-results{--event-color:#805d1b;--event-tint:#fff6df}
.schedule-row.milestone-winner{--event-color:#84236c;--event-tint:#faf0f7}
.schedule-row.milestone .schedule-info h3{background:var(--event-color);color:#fff;padding:9px 12px;border-radius:4px;font-size:18px;font-weight:750;line-height:1.6;margin-bottom:12px}
.schedule-row.milestone .schedule-clock time{color:var(--event-color);font-weight:800}
.schedule-row.milestone .schedule-check{color:var(--text)}
.schedule-row.schedule-live{background:#f4f8fd}
.schedule-row.schedule-live .schedule-info h3{color:#203f65;font-weight:750}
body:not(.light) .schedule-row.milestone{--event-tint:#233044}
body:not(.light) .schedule-row.milestone .schedule-clock time{color:#d6e5ff}
body:not(.light) .schedule-row.schedule-live{background:#1d2b41}
body:not(.light) .schedule-row.schedule-live .schedule-info h3{color:#a4c5ff}

/* Original team sheet: navy banner, thin blue rules and distinct player cards. */
.pdf-button{background:#102c65;color:#fff;border-color:#102c65;font-weight:650}
.pdf-button:hover{background:#1b4088!important;color:#fff;text-decoration:none}
.team-pills{display:none}
.team-banner{position:relative;background:#071534;color:#fff;border-radius:8px;overflow:hidden;padding:21px 25px 24px}
.team-banner-label{display:block;color:#65d7f7;font-size:11px;font-weight:750;letter-spacing:.12em;margin-bottom:9px}
.team-banner-title{display:flex;align-items:baseline;gap:15px;min-width:0}
.team-banner .page-title{color:#fff;overflow-wrap:anywhere}
.team-code{color:#55d6fa;font-size:16px;letter-spacing:.05em;font-weight:800;flex-shrink:0}
.team-banner-pron{font-size:15px;color:#a9c6ff;margin:5px 0 0 49px}
.team-summary{margin:22px 0 26px;border-bottom:1px solid var(--line)}
.team-summary .ref-box{display:grid;grid-template-columns:90px minmax(0,1fr);gap:15px;padding:13px 0;margin:0;border-top:1px solid var(--line)}
.team-summary .ref-box h3{color:var(--accent);font-size:13px;padding-top:2px;margin:0}
.team-summary .ref-content{font-size:15px;line-height:1.8}
.team-summary .ref-content p{margin:0}
.players-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 15px}
.players-heading h2{font-size:18px}
.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.player{background:var(--paper);border:1px solid var(--blue-line);border-radius:8px;padding:23px;min-width:0}
.player-header{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid #19325c;padding-bottom:14px;margin-bottom:15px}
.player-header>div{min-width:0}
.player-number{color:var(--accent);font-size:15px;font-weight:800;flex-shrink:0}
.player h3{font-size:23px;line-height:1.35;letter-spacing:-.03em;overflow-wrap:anywhere}
.pron{font-size:14px;color:var(--accent);margin:4px 0 0}
.tier-badge{display:inline-flex;align-items:center;gap:7px;color:var(--text);font-size:13px;font-weight:750;line-height:1.5;padding:4px 9px;border:1px solid var(--blue-line);background:var(--soft);border-radius:5px;white-space:nowrap;flex-shrink:0}
.rank-diamond{display:inline-block;width:9px;height:9px;background:var(--rank-color,#1d91c2);transform:rotate(45deg);flex-shrink:0}
.eternity{--rank-color:#d4a214}.demigod{--rank-color:#de685a}.mithril{--rank-color:#1d99c2}
.player-rank{padding:14px 16px;background:var(--soft);border:1px solid var(--blue-line);border-radius:6px}
.rank-label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.player-rank .tier-badge{padding:0;border:0;background:none;font-size:27px;font-weight:850;gap:12px;letter-spacing:-.035em}
.player-rank .rank-diamond{width:13px;height:13px}
.player-section{margin-top:22px}
.player-section h4{display:flex;align-items:center;gap:8px;margin:0 0 10px;color:var(--accent);font-size:14px;line-height:1.5;font-weight:750}
.player-section h4:after{content:"";height:1px;background:var(--blue-line);flex:1;min-width:12px}
.player-section h4 small{font-size:11px;font-weight:400;white-space:nowrap}
.player-section p{font-size:15px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}
.player-section p+p{margin-top:8px}
.champions{display:flex;flex-wrap:wrap;gap:6px;margin:0}
.champions span{font-size:14px;font-weight:650;line-height:1.5;padding:3px 9px;border:1px solid var(--blue-line);border-radius:5px}
.career-list{padding:0 0 0 17px;margin:0}
.career-list li{font-size:14px;line-height:1.7;margin:5px 0;overflow-wrap:anywhere}
.career-list li::marker{color:var(--accent)}
.career-list strong{color:var(--script-accent);font-weight:850}
.stats{display:flex;flex-wrap:wrap;gap:12px 18px;margin:24px 0 0;padding:15px 0 0;border-top:1px solid var(--line)}
.stat span{display:block;font-size:11px;color:var(--muted)}
.stat b{font-size:13px;font-weight:500;color:var(--muted)}
.team-overview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:24px 0}
.team-tile{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;min-width:0;padding:0;text-align:left;border:1px solid var(--blue-line);background:var(--paper);border-radius:8px;overflow:hidden}
.team-tile:hover{background:var(--paper)!important;border-color:var(--accent);box-shadow:0 3px 14px #1e479013}
.team-tile-head{display:block;position:relative;background:#071534;color:#fff;padding:17px 20px 20px;height:132px;min-height:132px;flex:0 0 132px}
.team-tile .team-code{font-size:12px}
.team-tile strong{display:block;font-size:23px;line-height:1.35;margin:3px 0;overflow-wrap:anywhere}
.team-pron{font-size:13px;color:#a9c6ff}
.roster{display:block;flex:1;margin:4px 20px 0}
.roster-player{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.6}
.roster-player>span:first-child{min-width:0;overflow-wrap:anywhere;color:var(--text);font-weight:650}
.roster-player:last-child{border-bottom:0}
.team-tile-link{display:block;margin-top:auto;padding:9px 20px 17px;color:var(--accent);font-size:12px;font-weight:650}
/* Team groups keep all player fields within the reading width. */
.roster-groups{display:grid;gap:26px;margin:25px 0;min-width:0}
.roster-group{container-type:inline-size;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--paper);overflow:clip;--team-tone:#2563eb;--team-tint:#edf3ff}
.team-tone-1{--team-tone:#087ea4;--team-tint:#eaf8fc}.team-tone-2{--team-tone:#635ac8;--team-tint:#f1effd}.team-tone-3{--team-tone:#0f766e;--team-tint:#eaf7f3}.team-tone-4{--team-tone:#4b6f99;--team-tint:#eff4fa}.team-tone-5{--team-tone:#8a53a6;--team-tint:#f7effb}.team-tone-6{--team-tone:#3452a0;--team-tint:#edf0fb}.team-tone-7{--team-tone:#187bb8;--team-tint:#edf7ff}
.roster-group-title{font-size:19px;border-top:4px solid var(--team-tone);background:var(--team-tint);margin:0}
.roster-group-title button{width:100%;display:flex;align-items:center;gap:12px;padding:15px 18px;text-align:left;min-width:0}
.roster-group-title button>span:first-child{color:var(--team-tone);font-size:13px;font-weight:800;flex-shrink:0}
.roster-group-title b{min-width:0;overflow-wrap:anywhere}
.roster-group-title .group-open{margin-left:auto;color:var(--team-tone);font-size:18px}
.roster-table{width:100%;min-width:0;table-layout:fixed;border-collapse:collapse;font-size:14px}
.col-player{width:26%}.col-tier{width:18%}.col-champions{width:24%}.col-stats{width:32%}
.roster-table th,.roster-table td{padding:14px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.roster-table th{color:var(--muted);font-size:12px;font-weight:600;background:var(--paper)}
.roster-table tbody tr:last-child td{border-bottom:0}
.roster-table tbody tr:nth-child(even){background:var(--bg)}
.roster-name strong{font-size:15px;line-height:1.6}.roster-name small{display:block;font-size:12px;margin-top:4px;color:var(--accent)}
.roster-table .tier-badge{font-size:13px;padding:3px 7px;gap:6px}
.roster-champions>span{display:inline-block;margin:0 7px 4px 0;font-size:13px;line-height:1.7}
.roster-stats dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 12px;margin:0}
.roster-stats dl>div{min-width:0;display:flex;justify-content:space-between;gap:5px;font-size:11px;color:var(--muted);line-height:1.8}
.roster-stats dt,.roster-stats dd{margin:0}.roster-stats dd{font-variant-numeric:tabular-nums;font-weight:600}
body:not(.light) .roster-group{--team-tint:#23334d}
body:not(.light) .roster-group-title button>span{color:var(--accent)}
@container(max-width:700px){
 .roster-table,.roster-table tbody{display:block;width:100%}
 .roster-table colgroup{display:none}
 .roster-table thead{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
 .roster-table tr.roster-table-player{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:17px 18px;border-bottom:1px solid var(--line)}
 .roster-table tr.roster-table-player:last-child{border-bottom:0}
 .roster-table td{display:block;min-width:0;padding:0;border:0}
 .roster-champions,.roster-stats{grid-column:1 / -1}
 .roster-table td[data-label]:before{content:attr(data-label);display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
 .roster-stats dl{display:flex;flex-wrap:wrap;gap:7px 18px}
 .roster-stats dl>div{justify-content:flex-start;gap:7px;font-size:12px}
}
.talk-item{background:var(--paper);border-bottom:1px solid var(--line);padding:22px;margin:0}
.talk-item .row{flex-wrap:wrap}.talk-item h3{font-size:18px}
.talk-item p{font-size:15px;line-height:1.8;margin-top:7px}
.talk-item button{font-size:14px;color:var(--accent)}

:[{"role":"해설1 · Q2 (퀴즈 화면 나가면)","text":"두 번째 문제는 경품으로 드리는 마우스패드 문제인데요,\n터틀비치 센스 코어 미니의 사이즈는? (숫자로만 읽으시면 편할거에요! 사백오십,사백오십)\n① 450×450mm ② 250×210mm ③ 900×420mm"},{"role":"해설2 · Q3 (퀴즈 화면 나가면)","text":"마지막 세 번째 문제,\n이번 대회 경품으로 드리는 이어폰의 정식 제품명은?\n① 터틀비치 리콘 배틀버즈 게이밍 이어폰\n② 터틀비치 스카웃 에어 블루투스 무선 게이밍 이어폰\n③ 터틀비치 아틀라스 에어 오픈백 무선 게이밍 헤드셋 블랙"},{"role":"해설1","text":"그리고 대회 개최를 기념하여 터틀비치 스페셜 세일도 진행중입니다.\n10월 12일 오전 11시까지 진행되니까요,\n화면의 QR로 확인해 보시기 바랍니다!"},{"role":"캐스터","text":"네, 여러분의 많은 참여 바라고요.\n오늘 준비된 이벤트가 더 있는데요, 이어서 소개해 드리겠습니다."}],"notes":["●정답은 방송에서 말하지 않기","●스페셜 세일\n10.8(목) 18:00 ~\n10.12(월) 11:00\n판매처 QR"],"context":[],"mic":[],"source":"cue","page":14,"oap":[{"asset":"cue-oap-14-1.webp","label":"퀴즈 Q2","width":864,"height":504},{"asset":"cue-oap-14-2.webp","label":"퀴즈 Q3","width":864,"height":484}],"group":"파트너·이벤트","time":"11:58"},{"id":15,"title":"이벤트 · 승부 예측","blocks":[{"role":"캐스터 → 해설2","text":"먼저 승부 예측 이벤트입니다.\n현동님이 소개 부탁드릴게요."},{"role":"해설2","text":"네, 오늘 IGA 라이징 우승팀을 예측해 주시면 되는데요,\n참여 방법은 화면 QR이나 라이징 공식 계정에서 참여해주시면 되고요,\n맞히신 분 중 추첨으로 한 분께\nbhc 뿌링클 콤보 세트 기프티콘을 드립니다!"},{"role":"캐스터","text":"승부 예측은 1라운드 경기 1일차 밤까지 진행되니까요,\n시간 내에 참여해주시면 되겠습니다.\n어느 팀이 오늘의 주인공이 될지,\n여러분도 직접 예측해 보시죠!"}],"notes":["OAP 준비 중\n승부 예측 · 시청 인증 공통","●상품 · 추첨 1명\n– bhc 뿌링클 콤보 세트 기프티콘\n– 마감 · 1라운드 인게임 1일차 밤"],"context":[],"mic":[],"source":"cue","page":15,"oap":[{"asset":"cue-oap-15-1.webp","label":"OAP 준비 중 · 승부 예측","width":864,"height":504}],"group":"파트너·이벤트","time":"11:58"},{"id":16,"title":"이벤트 · 시청 인증","blocks":[{"role":"캐스터 → 해설2","text":"그리고 시청 인증 이벤트도 있습니다.\n현동님?"},{"role":"해설2","text":"네, 오늘 방송을 보시고 인증해 주시면 되는데요,\n인증 방법은 방송 QR과 라이징 공식 계정에서 확인 가능하시고요,\n추첨으로 열 분께\nCU 3,000원 기프티콘을 드립니다!"},{"role":"캐스터","text":"방송만 봐도 선물 받을 기회가 생기는 거죠!\n이벤트는 방송 클로징 때까지 진행되니까요,\n오늘 라이징, 끝까지 함께 보면서 인증 잊지 마세요!"}],"notes":["OAP 준비 중\n승부 예측 · 시청 인증 공통","●상품 · 추첨 10명\n– CU 3,000원 기프티콘"],"context":[],"mic":[],"source":"cue","page":16,"oap":[{"asset":"cue-oap-16-1.webp","label":"OAP 준비 중 · 시청 인증","width":864,"height":504}],"group":"파트너·이벤트","time":"11:58"},{"id":17,"title":"이벤트 · 설문조사","blocks":[{"role":"캐스터 → 해설1","text":"마지막으로 시청자 설문 이벤트도 진행 중입니다.\n채팅창 고정 댓글에서 참여하실 수 있고요,"},{"role":"해설1","text":"오늘 대회 보시면서 좋았던 점, 아쉬웠던 점\n편하게 남겨 주시면\n인천 웨이브에서 준비한 인게임 시즌 7 패키지 다섯 분,\n시즌 8 패키지 다섯 분, 총 열 분께 추첨으로 드립니다!"},{"role":"캐스터 · 전환 (PD 큐)","text":"네, 오늘 퀴즈부터 시작해서 이벤트가 다양하게 준비되어 있으니까요\n놓치지 마시고 많은 참여 바랍니다.\n이어서 예선 지표도 준비가 되어 있는데요,\n예선 팀 결과부터 관전 포인트 짚어보시죠."}],"notes":["OAP 준비 중\n설문조사","●경품 · 인천 웨이브 제공\n– 시즌 7 패키지 5명\n– 시즌 8 패키지 5명\n(추첨 총 10명)","●설문 링크 · 채팅창 고정 댓글"],"context":[],"mic":[],"source":"cue","page":17,"oap":[{"asset":"cue-oap-17-1.webp","label":"OAP 준비 중 · 설문조사","width":864,"height":504},{"asset":"cue-oap-17-2.webp","label":"설문조사 경품 참고","width":508,"height":736}],"group":"파트너·이벤트","time":"11:58"},{"id":18,"title":"관전 포인트 1 · 예선 팀 스탯","blocks":[{"role":"해설2","text":"네, 예선 누적 점수 1위는 Rump Rebels(럼프 레벨스) 94점,\n2위 Desperado(데스페라도) 87.5점, 3위 Down To Earth(다운 투 어스) 78점이\n고요,\n킬 점수도 Rump Rebels(럼프 레벨스)가 60점으로 가장 높았습니다."},{"role":"해설1 · 자유 답변","text":"(예) Rump Rebels(럼프 레벨스)는 베테랑 선수들이 모인 팀이라\n누적 TS, KS 모두 1등이었네요,\nDesperado(데스페라도)도 쟁쟁한 팀이라 만만치 않습니다."},{"role":"캐스터· 자유롭게","text":"네, 예선 1, 2위 팀이 결승에서도\n그 기세를 이어갈 수 있을지 지켜보시죠."}],"notes":["●누적 TS TOP 3\nRump Rebels(럼프 레벨스) 94\nDesperado(데스페라도) 87.5\nDown To Earth(다운 투 어\n스) 78","●누적 KS TOP 3\nRump Rebels(럼프 레벨스) 60\nDesperado(데스페라도) 50.5\nDown To Earth(다운 투 어\n스) 47"],"context":[],"mic":[],"source":"cue","page":18,"oap":[{"asset":"cue-oap-18-1.webp","label":"예선 팀 스탯","width":864,"height":504}],"group":"관전 포인트","time":"12:03"},{"id":19,"title":"관전 포인트 2 · 상위 픽 TOP 3","blocks":[{"role":"캐스터","text":"그리고 예선에서 가장 많이 나온 실험체는요?"},{"role":"해설2","text":"네, 예선 픽 수인데요.\n3위는 칼라 11번, 공동 2위로 니아·마커스·아르다가 12번씩,\n그리고 대망의 1위는 케네스가 20번 나왔어요."},{"role":"해설1 · 자유 답변","text":"(예) 케네스는 결승 8팀 중 7팀이 조합에 넣었을 정도인데요,\n재키 장인인 이쟈요이사쿠야 선수도\n대회에서는 케네스를 꺼냈습니다."},{"role":"캐스터· 자유롭게","text":"네, 오늘 결승에서도 케네스가\n몇 번이나 나올지 지켜보시죠."}],"notes":[],"context":[],"mic":[],"source":"cue","page":19,"oap":[{"asset":"cue-oap-19-1.webp","label":"예선 상위 픽 TOP 3","width":864,"height":504}],"group":"관전 포인트","time":"12:03"},{"id":20,"title":"관전 포인트 3 · 한 실험체 최다 플레이 팀","blocks":[{"role":"캐스터","text":"다음은 같은 실험체를 많이 플레이한 팀입니다."},{"role":"해설1 · 자유 답변","text":"(예) 네, 스따라이뜨, Down To Earth(다운 투 어스), NOFLASH(노플래시) 세 팀이\n예선 네 판 모두 같은 조합으로 나왔어요.\nSoundVoltex(사운드볼텍스) 선수의 엠마, 눈꽃닢 선수의 이안,\n부닭 선수의 프리야처럼 장인 픽이 그대로 나온 팀들입니다."},{"role":"해설2 · 자유 답변","text":"(예) 그리고 세 팀 모두 케네스가 들어가 있는데요,\n오늘 케네스가 밴 되면\n조합을 바꿔야 하는 상황이 올 수도 있습니다."},{"role":"캐스터· 자유롭게","text":"네, 밴만 피한다면 오늘도\n네 판 내내 같은 조합을 볼 수 있겠습니다."}],"notes":["스따라이뜨","킬이너무부족해 · 케네스\nS12 주력 2순위 (1순위 마커스 180판)\nSoundVoltex(사운드볼텍스) · 엠마\n엠마 장인 · 랭크 대부분이 엠마\n눈꽃닢 · 이안\n이안 장인 · 이안 140판으로 이터니티","Down To Earth(다운 투 어스)","이쟈요이사쿠야 · 케네스\nS12 주력 3순위 (재키 장인 598판)\n빛구리 · 비형\nS12 주력 카밀로·키아라\n월요일쪼아 · 아르다\nS12 주력 아님 (라우라·알렉스·슈린)","NOFLASH(노플래시)","엉덩이만지는사람 · 케네스\n대회 주력 마커스·케네스·펜리르\n부닭 · 프리야\n프리야 장인 (S10 소개 ‘프리야 장인’)\n신속배달재정반점 · 에이든\n대회 주력 에이든·실비아"],"context":[],"mic":[],"source":"cue","page":20,"oap":[{"asset":"cue-oap-20-1.webp","label":"한 실험체 최다 플레이 팀","width":864,"height":504}],"group":"관전 포인트","time":"12:03"},{"id":21,"title":"관전 포인트 4 · 팀별 주요 픽","blocks":[{"role":"캐스터","text":"네, 그리고 팀별 주요 픽도 한번 만나보겠습니다."},{"role":"해설1 · 자유 답변","text":"(예) lusa(루사) 선수의 히스이, Raim(라임) 선수의 키아라,\n4sek(사색) 선수의 아이작처럼\n장인 픽이 그대로 나온 팀이 많고요,"},{"role":"해설2 · 자유 답변","text":"(예) Four Demigod(포 데미갓)은 김영민 선수가\n이슈트반을 꺼냈는데요.\n오늘은 어떤 조합이 나올지 보시면 재밌을 것 같아요."}],"notes":["●8팀 중 6팀 조합에 케네스\n(어쩌다 이지경\nRump Rebels(럼프 레벨스)만","없음)"],"context":["팀별 주요 픽 (예선)","Desperado(데스페라도) 윌리엄·케네스·비앙카 · 어쩌다 이지경 히스이·셀린·엘레나\nRump Rebels(럼프 레벨스) 아르다·피오라·아이작 · 스따라이뜨 케네스·엠마·이안\nFour Demigod(포 데미갓) 이슈트반·아르다·케네스 · Cat Lover(캣 러버) 키아라·케네스·프리야\nDown To Earth(다운 투 어스) 케네스·비형·아르다 · NOFLASH(노플래시) 케네스·프리야·에이든"],"mic":[],"source":"cue","page":21,"oap":[{"asset":"cue-oap-21-1.webp","label":"팀별 주요 픽","width":864,"height":504}],"group":"관전 포인트","time":"12:03"},{"id":22,"title":"관전 포인트 5 · 예선 밴 실험체","blocks":[{"role":"캐스터","text":"그리고 마지막으로 예선에서 밴이 됐던 실험체입니다."},{"role":"해설1","text":"네, 예선에서는 케네스와 마커스가 한 번씩 밴이 됐어요.\n두 실험체 모두 예선 픽 수 상위권이라\n세 팀 이상이 고르면서 다음 라운드에 쓸 수 없게 된 건데요."},{"role":"해설2","text":"케네스를 쓰는 팀이 일곱 팀이나 되는 만큼,\n오늘도 1라운드에 케네스가 몰리면 2라운드엔 바로 밴이 됩니다.\n그때 각 팀이 어떤 카드를 꺼낼지가 관건이에요."},{"role":"캐스터· 자유롭게","text":"네, 왜 밴이 되는지 바로 알 수 있는 실험체들이죠.\n오늘은 밴이 몇 번이나 나올지도 지켜보시죠."}],"notes":["●밴 규칙: 한 라운드에서 3팀 이상 고\n른 실험체는 다음 라운드 사용 불가"],"context":[],"mic":[],"source":"cue","page":22,"oap":[{"asset":"cue-oap-22-1.webp","label":"예선 밴 실험체","width":864,"height":504}],"group":"관전 포인트","time":"12:03"},{"id":23,"title":"1라운드 시작","blocks":[{"role":"공동 · PD 콜 오기 전","text":"1라운드 시작 전 자유 대화"},{"role":"캐스터","text":"아직 어느 팀도 점수가 없는 상태,\n오늘의 첫 판도를 만드는 경기입니다."},{"role":"캐스터 · 전환 (PD 큐)","text":"선수들도 오래 기다렸을 텐데요,\n여러분이 기다리신 첫 번째 라운드,\n지금 바로 출발합니다!"},{"role":"공동 · 픽 완료되면","text":"픽·조합과 1라운드 경기에 대해 자유 대화"}],"notes":[],"context":[],"mic":[],"source":"cue","page":23,"oap":[{"asset":"cue-oap-23-1.webp","label":"중계진 화면","width":864,"height":504}],"group":"1R","time":"12:03"},{"id":24,"title":"1라운드 리뷰","blocks":[{"role":"캐스터· 자유롭게","text":"(종료 순간)\n“팀이 1라운드 최종 생존을 가져갑니다!”\n첫 번째 라운드가 마무리됐습니다."},{"role":"캐스터 → 해설1","text":"“영랑님은 이번 라운드 전반적으로 어떻게 보셨을까요?”"},{"role":"해설1 · 자유 답변","text":"픽·조합과 생존팀, 1라운드 경기에 대해 자유 대화"},{"role":"캐스터 → 해설2","text":"“현동님도 어떻게 보셨을까요?”"},{"role":"해설2 · 자유 답변","text":"픽·조합과 생존팀, 1라운드 경기에 대해 자유 대화"}],"notes":[],"context":[],"mic":[],"source":"cue","page":24,"oap":[{"asset":"cue-oap-24-1.webp","label":"중계진 화면","width":864,"height":504}],"group":"1R","time":"12:38"},{"id":25,"title":"1라운드 경기결과","blocks":[{"role":"캐스터","text":"첫 번째 라운드 마무리됐고요,\n경기결과 한번 살펴보고 가겠습니다."},{"role":"해설2 · 1~3위","text":"네, 1라운드 경기결과입니다.\n1위 팀 킬킬 점수점,\n2위 팀 점수점, 3위 팀 점수점입니다."},{"role":"해설1 · 4~5위 + 한마디","text":"이어서 4위 팀 점수점, 5위 팀 점수점입니다.\n자유롭게 짧게 한마디"},{"role":"캐스터 · 6~8위 + 마무리","text":"그 아래로 6위 팀, 7위 팀, 8위 팀입니다.\n아직 세 라운드가 남아 있어서\n순위는 얼마든지 바뀔 수 있습니다."}],"notes":[],"context":[],"mic":[],"source":"cue","page":25,"oap":[{"asset":"cue-oap-25-1.webp","label":"리더보드","width":864,"height":504}],"group":"1R","time":"12:38"},{"id":26,"title":"2라운드 시작","blocks":[{"role":"공동 · PD 콜 오기 전","text":"2라운드 시작 전 자유 대화"},{"role":"캐스터","text":"이어서 2라운드입니다.\n첫 라운드를 마친 현재 선두는 팀입니다."},{"role":"캐스터 · 전환 (PD 큐)","text":"누가 첫 결과를 이어가고 누가 반격할지,\n제2라운드 루미아 섬으로 떠나보겠습니다!"},{"role":"공동 · 픽 완료되면","text":"픽·조합과 2라운드 경기에 대해 자유 대화"}],"notes":[],"context":[],"mic":[],"source":"cue","page":26,"oap":[{"asset":"cue-oap-26-1.webp","label":"중계진 화면","width":864,"height":504}],"group":"2R","time":"12:38"},{"id":27,"title":"2라운드 리뷰","blocks":[{"role":"캐스터· 자유롭게","text":"(종료 순간)\n“팀이 2라운드 최종 생존을 가져갑니다!”\n두 번째 라운드가 마무리됐습니다."},{"role":"캐스터 → 해설1","text":"“흑영랑님은 이번 라운드 전반적으로 어떻게 보셨을까요?”"},{"role":"해설1 · 자유 답변","text":"픽·조합과 생존팀, 2라운드 경기에 대해 자유 대화"},{"role":"캐스터 → 해설2","text":"“현동 님도 어떻게 보셨을까요?”"},{"role":"해설2 · 자유 답변","text":"픽·조합과 생존팀, 2라운드 경기에 대해 자유 대화"}],"notes":[],"context":[],"mic":[],"source":"cue","page":27,"oap":[{"asset":"cue-oap-27-1.webp","label":"중계진 화면","width":864,"height":504}],"group":"2R","time":"13:13"},{"id":28,"title":"2라운드 경기결과","blocks":[{"role":"캐스터","text":"두 번째 라운드 마무리됐고요,\n경기결과 한번 살펴보고 가겠습니다."},{"role":"해설2 · 1~3위","text":"네, 2라운드 경기결과입니다.\n1위 팀 킬킬 점수점,\n2위 팀 점수점, 3위 팀 점수점입니다."},{"role":"해설1 · 4~5위 + 한마디","text":"이어서 4위 팀 점수점, 5위 팀 점수점입니다.\n자유롭게 짧게 한마디"},{"role":"캐스터 · 6~8위 + 마무리","text":"그 아래로 6위 팀, 7위 팀, 8위 팀입니다.\n오늘 경기가 반환점을 돌았습니다.\n남은 경기는 두 번, 이제 한 번의 결과가 훨씬 크게 작용합니다."},{"role":"공동 · PD 콜 오기 전","text":"쉬는시간 전환 준비 전 자유 대화"}],"notes":[],"context":[],"mic":[],"source":"cue","page":28,"oap":[{"asset":"cue-oap-28-1.webp","label":"리더보드","width":864,"height":504}],"group":"2R","time":"13:13"},{"id":29,"title":"쉬는 시간","blocks":[{"role":"캐스터","text":"과연 남은 두 개 라운드 선수들이 어떤 조합을 갖고 나올지,\n피드백은 어떻게 진행할지,\n저희 쉬는 시간 10분 이후에 다시 찾아뵙도록 하겠습니다."}],"notes":[],"context":[],"mic":["MIC OFF"],"source":"cue","page":29,"oap":[{"asset":"cue-oap-29-1.webp","label":"중계진 화면","width":864,"height":504}],"group":"쉬는 시간","time":"13:13"},{"id":30,"title":"3라운드 시작 전 1 · 파트너","blocks":[{"role":"캐스터 · 복귀","text":"네, 저희 다시 돌아왔습니다.\nIGA 라이징으로 다시 한번 인사드리겠습니다.\n이제 3라운드를 앞두고 있고요,\n남은 라운드는 단 두 개입니다."},{"role":"캐스터","text":"경기 시작 전에 오늘 IGA 라이징은 공식 스폰서\n터틀비치와 함께하고 있는데요,\n시청자분들을 위한 퀴즈 이벤트도 진행 중입니다!"},{"role":"해설2","text":"참여 방법은 간단합니다.\n지금 보시는 화면의 QR로 정답을 제출해 주시면 되고,\n정답자 중 추첨으로 네 분께\n터틀비치 이어폰과 마우스패드를 드립니다!\n대회 개최 기념 터틀비치 스페셜 세일도 10월 12일 오전 11시까지 진행됩니다."}],"notes":["●QR이 화면에 나올 때 안내","●경품 · 추첨 4명, 1인 1개\n– 리콘 배틀버즈 블랙 이어폰\n– 센스 코어 마우스패드","●스페셜 세일\n10.8(목) 18:00 ~\n10.12(월) 11:00\n판매처 QR"],"context":[],"mic":["MIC ON"],"source":"cue","page":30,"oap":[{"asset":"cue-oap-30-1.webp","label":"터틀비치 이벤트","width":864,"height":504}],"group":"3R","time":"13:30"},{"id":31,"title":"3라운드 시작 전 2 · 시청 인증·설문조사","blocks":[{"role":"캐스터 → 해설2","text":"그리고 지금 진행 중인 이벤트도 다시 한번 안내해 드릴게요.\n현동님?"},{"role":"해설2 · 시청 인증","text":"네, 먼저 시청 인증 이벤트는 방송 QR과\n라이징 공식 계정에서 인증 방법 확인하실 수 있고요,\n추첨으로 열 분께 CU 3,000원 기프티콘을 드립니다!"},{"role":"캐스터","text":"방송 클로징 때까지 진행되니까요, 인증 잊지 마시고요.\n그리고 채팅창 고정 댓글에는\nIGA 라이징 시청자 설문 이벤트도 올라가 있습니다!"},{"role":"해설1 · 설문조사","text":"오늘 대회 보시면서 좋았던 점, 재밌었던 점,\n더 나아졌으면 하는 점을 편하게 적어 주시면\n인천 웨이브 시즌 7 패키지 다섯 분, 시즌 8 패키지 다섯 분,\n총 열 분께 추첨으로 드립니다!"},{"role":"캐스터","text":"여러분의 의견이 큰 도움이 됩니다.\n잠깐 들어가셔서 많은 참여 부탁드립니다!"}],"notes":["OAP 준비 중\n승부 예측 · 시청 인증 공통","●시청 인증 · 추첨 10명\n– CU 3,000원 기프티콘\n– 마감 · 클로징 때까지","●설문 링크 · 채팅창 고정 댓글","●설문 경품 · 인천 웨이브 제공\n– 시즌 7 패키지 5명\n– 시즌 8 패키지 5명"],"context":[],"mic":[],"source":"cue","page":31,"oap":[{"asset":"cue-oap-31-1.webp","label":"OAP 준비 중 · 시청 인증","width":864,"height":504}],"group":"3R","time":"13:30"},{"id":32,"title":"3라운드 시작 3","blocks":[{"role":"캐스터 → 해설1","text":"네, 그러면 다시 경기로 돌아가서요,\n영랑님께서 2라운드까지 흐름 한번 짚어주시죠."},{"role":"해설1 · 앞 경기 흐름 짚기 · 자유 진행","text":"네, 2라운드에서는 팀이 기회를 잘 살리면서\n점수를 크게 끌어올렸고요,\n팀도 남은 두 라운드에서 반등할 수 있을지\n지켜보시면 좋겠습니다."},{"role":"공동 · PD 콜 오기 전","text":"3라운드 시작 전 자유 대화"},{"role":"캐스터 · 전환 (PD 큐)","text":"선수분들 준비가 끝났다고 하니까요,\n지체 없이 바로 세 번째 라운드 만나보겠습니다."},{"role":"공동 · 픽 완료되면","text":"픽·조합과 3라운드 경기에 대해 자유 대화"}],"notes":[],"context":[],"mic":[],"source":"cue","page":32,"oap":[{"asset":"cue-oap-32-1.webp","label":"중계진 화면","width":864,"height":504}],"group":"3R","time":"13:33"},{"id":33,"title":"3라운드 리뷰","blocks":[{"role":"캐스터· 자유롭게","text":"(종료 순간)\n“팀이 3라운드 최종 생존을 가져갑니다!”\n세 번째 라운드가 마무리됐습니다."},{"role":"캐스터 → 해설1","text":"“영랑님은 이번 라운드 전반적으로 어떻게 보셨을까요?”"},{"role":"해설1 · 자유 답변","text":"픽·조합과 생존팀, 3라운드 경기에 대해 자유 대화"},{"role":"캐스터 → 해설2","text":"“현동 님도 어떻게 보셨을까요?”"},{"role":"해설2 · 자유 답변","text":"픽·조합과 생존팀, 3라운드 경기에 대해 자유 대화"}],"notes":[],"context":[],"mic":[],"source":"cue","page":33,"oap":[{"asset":"cue-oap-33-1.webp","label":"중계진 화면","width":864,"height":504}],"group":"3R","time":"14:06"},{"id":34,"title":"3라운드 경기결과","blocks":[{"role":"캐스터","text":"세 번째 라운드 마무리됐고요,\n경기결과 한번 살펴보고 가겠습니다."},{"role":"해설2 · 1~3위","text":"네, 3라운드 경기결과입니다.\n1위 팀 킬킬 점수점,\n2위 팀 점수점, 3위 팀 점수점입니다."},{"role":"해설1 · 4~5위 + 한마디","text":"이어서 4위 팀 점수점, 5위 팀 점수점입니다.\n자유롭게 짧게 한마디"},{"role":"캐스터 · 6~8위 + 마무리","text":"그 아래로 6위 팀, 7위 팀, 8위 팀입니다.\n현재 팀 수개 팀까지 우승 가능성이 남아 있습니다.\n이제 마지막 한 경기입니다."}],"notes":[],"context":[],"mic":[],"source":"cue","page":34,"oap":[{"asset":"cue-oap-34-1.webp","label":"리더보드","width":864,"height":504}],"group":"3R","time":"14:06"},{"id":35,"title":"4라운드 시작","blocks":[{"role":"공동 · PD 콜 오기 전","text":"4라운드 시작 전 자유 대화"},{"role":"캐스터· 자유롭게","text":"이제 정말 마지막입니다. 현재 선두는 팀,\n팀·팀가 추격하고 있습니다.\n하위권 팀들도 모두 예선을 뚫고 올라온 팀들인 만큼,\n마지막 라운드에서 유종의 미를 거둘 수 있을지도 지켜보시죠."},{"role":"캐스터 → 해설1","text":"(예) “마지막 라운드, 어느 팀을 가장 눈여겨보면 될까요?”"},{"role":"캐스터 · 전환 (PD 큐) · 자유롭게","text":"이제 모든 계산은 끝났습니다.\n최종 순위를 결정할 제4라운드,\n라이징 스타는 누가 될까요? 루미아 섬으로 떠나보겠습니다!"},{"role":"공동 · 픽 완료되면","text":"픽·조합과 마지막 라운드 경기에 대해 자유 대화"}],"notes":[],"context":[],"mic":[],"source":"cue","page":35,"oap":[{"asset":"cue-oap-35-1.webp","label":"리더보드","width":864,"height":504}],"group":"4R","time":"14:06"},{"id":36,"title":"4라운드 리뷰","blocks":[{"role":"캐스터· 자유롭게","text":"(종료 순간)\n“팀이 4라운드 최종 생존을 가져갑니다!”"},{"role":"해설2 · 자유롭게","text":"마지막 경기 정리"},{"role":"해설1 · 자유롭게","text":"마지막 경기 정리"},{"role":"공동 · 자유 대화","text":"결정적 장면을 만든 팀, 아깝게 탈락한 팀, 기억에 남는 장면"},{"role":"캐스터 · 전환 (PD 큐)","text":"네, 그러면 이터널리턴 라이징 대회\n4라운드 리더보드 바로 만나보도록 하겠습니다."}],"notes":[],"context":[],"mic":[],"source":"cue","page":36,"oap":[{"asset":"cue-oap-36-1.webp","label":"중계진 화면","width":864,"height":504}],"group":"4R","time":"14:41"},{"id":37,"title":"4라운드 경기결과","blocks":[{"role":"해설2 · 1~3위","text":"네, 4라운드 경기결과입니다.\n1위 팀 킬킬 점수점,\n2위 팀 점수점, 3위 팀 점수점입니다."},{"role":"해설1 · 4~5위 + 한마디","text":"이어서 4위 팀 점수점, 5위 팀 점수점입니다.\n자유롭게 짧게 한마디"},{"role":"캐스터 · 6~8위 + 마무리","text":"그 아래로 6위 팀, 7위 팀, 8위 팀입니다.\n결국 최종 우승팀은 !"}],"notes":[],"context":[],"mic":[],"source":"cue","page":37,"oap":[{"asset":"cue-oap-37-1.webp","label":"리더보드","width":864,"height":504}],"group":"4R","time":"14:41"},{"id":38,"title":"우승팀 발표","blocks":[{"role":"캐스터","text":"그럼 최종 순위 다시 정리하도록 하겠습니다."},{"role":"해설1 · 1~3위 + 우승 점수","text":"1위 팀 점수점, 2위 팀 점수점, 3위 팀 점수점입니다.\n자유롭게 의견"},{"role":"해설2 · 2·3위 소감","text":"2위 팀, 3위 팀도 끝까지 정말 좋은 경기 보여줬습니다.\n자유롭게 의견"},{"role":"공동 · 나머지 팀 격려 포함","text":"자유롭게 의견 제시"},{"role":"캐스터 · 전환 (PD 큐)","text":"최종 우승은 팀이 되었네요.\n잠시 후 오늘의 주인공을 직접 만나보겠습니다."}],"notes":["●","한마디 예\n– 아쉬웠던 장면\n– 순위를 가른 점수 차이\n– 기억에 남는 조합·장면을","보여준 팀\n- 순위권에 들지 못한 다른 팀 격려\n(좋은 경기 보여줬다 등)"],"context":[],"mic":[],"source":"cue","page":38,"oap":[{"asset":"cue-oap-38-1.webp","label":"리더보드","width":864,"height":504},{"asset":"cue-oap-38-2.webp","label":"중계진 화면","width":864,"height":484}],"group":"시상·클로징","time":"14:46"},{"id":39,"title":"우승팀 인터뷰","blocks":[{"role":"캐스터","text":"네, 안녕하세요! 우승 축하드립니다!"},{"role":"해설1·2","text":"축하드립니다!"},{"role":"캐스터 → 우승팀 · 인터뷰","text":"① 선수 자기소개\n② 오늘 가장 잘 풀린 부분\n③ 결정적 장면"},{"role":"캐스터 → 해설1·2","text":"두 해설께서도 궁금한 점 있으면\n질문 한번 해주시죠."}],"notes":["●우승팀 배너 하단 출력","●PD가 생략 큐 주면 바로\n→ 41(총평)"],"context":[],"mic":[],"source":"cue","page":39,"oap":[{"asset":"cue-oap-39-1.webp","label":"중계진 화면","width":864,"height":504}],"group":"시상·클로징","time":"14:49"},{"id":40,"title":"우승팀 인터뷰 · 이어서","blocks":[{"role":"해설1 → 우승팀 · 자유롭게","text":"자유롭게 짧게 한마디\n(예) “오늘\n조합을 꺼내셨는데,\n어떤 부분을 보고 준비하셨나요?”"},{"role":"해설2 → 우승팀 · 자유롭게","text":"자유롭게 짧게 한마디\n(예) “\n선수, 오늘 실험체로 주인공이 되셨는데요,\n이 실험체 잘하는 팁 하나 주신다면요?”\n(또는) “실험체에 전술 스킬로\n을 고르신 이유가 궁금합니다.”"},{"role":"캐스터 → 우승팀","text":"⑤ 선수별 질문\n⑥ 한 명씩 소감·팬 한마디"},{"role":"캐스터 · 전환 (PD 큐)","text":"다시 한번 우승 축하드리고,\n인터뷰는 여기서 마무리하겠습니다.\n라이징의 우승팀 이었습니다."}],"notes":["●우승팀 배너 하단 출력"],"context":[],"mic":[],"source":"cue","page":40,"oap":[{"asset":"cue-oap-40-1.webp","label":"중계진 화면","width":864,"height":504}],"group":"시상·클로징","time":"14:49"},{"id":41,"title":"총평","blocks":[{"role":"캐스터 → 해설1","text":"“오늘 네 라운드를 모두 중계해 보신 소감,\n영랑님 한 말씀 부탁드립니다.”"},{"role":"해설1 · 자유롭게","text":"(예) 네, 오늘 이렇게 수준 높은 경기를\n중계할 수 있어서 정말 영광이었습니다.\n우승한 팀 축하드리고,\n여덟 팀 모두 정말 수고 많으셨습니다."},{"role":"캐스터 → 해설2","text":"“현동 님도 소감 한 말씀 부탁드립니다.”"},{"role":"해설2 · 자유롭게","text":"(예) 저는 오늘 운영과 해설을 같이 맡아 많이 떨렸는데,\n두 분과 함께해서 긴장을 풀 수 있었습니다.\n끝까지 봐주신 시청자분들께 감사드립니다!"}],"notes":[],"context":[],"mic":[],"source":"cue","page":41,"oap":[{"asset":"cue-oap-41-1.webp","label":"중계진 화면","width":864,"height":504}],"group":"시상·클로징","time":"14:59"},{"id":42,"title":"클로징·끝인사","blocks":[{"role":"캐스터","text":"네, 이렇게 오늘 준비한 IGA 라이징 경기가 모두 마무리됐습니다.\n오늘 대회는 인천 게임아카데미 학생분들과 함께 만든 대회였는데요,\n부족한 모습이 있었더라도 너그럽게 봐주시면 감사하겠습니다."},{"role":"캐스터","text":"시청 인증 이벤트 아직 못 하신 분들 있다면\n지금 서두르셔서 기프티콘 획득의 기회 잡아가시길 바라고요.\n그리고 채팅창 고정 댓글에 시청자 설문 이벤트에\n의견 편하게 남겨 주시면 추첨을 통해\n인천 웨이브의 시즌 7 패키지 다섯 분, 시즌 8 패키지 다섯 분께 드립니다.\n또 저희 대회가 종료되어도\n터틀비치 스페셜 세일은 12일 월요일 오전 11시까지 진행되지 놓치지 마시기 바랍니다."},{"role":"캐스터 · 끝인사","text":"오늘 IGA 라이징,\n저는 지금까지 캐스터 방재혁이었고요,\n오늘 도움 말씀에는 흑영랑, 손현동 해설님 함께했습니다.\n시청해 주셔서 고맙습니다!"},{"role":"공동 · 다 같이","text":"감사합니다!"}],"notes":[],"context":[],"mic":["MIC OFF"],"source":"cue","page":42,"oap":[{"asset":"cue-oap-42-1.webp","label":"중계진 화면","width":864,"height":504}],"group":"시상·클로징","time":"14:59"}],"emergency":[{"id":1,"title":"경기 시작 지연","blocks":[{"role":"캐스터","text":"현재 경기 준비 과정에서\n확인이 필요한 부분이 있어\n잠시 대기하고 있습니다.\n확인되는 대로 바로 안내해 드리겠습니다."},{"role":"캐스터 → 해설1·2","text":"그 사이 이전 라운드 이야기 나눠 볼까요?"},{"role":"해설1·2 ·캐스터·자유롭게","text":"이전 라운드 복기 · 다음 라운드 관전 포인트"},{"role":"캐스터 · 준비가 끝나면","text":"준비가 모두 끝났습니다.\n제\n라운드, 루미아 섬으로 떠나보겠습니다!"}],"notes":["●원인·팀 이름 추측 금지","●제재 공지가 오면 → 긴급 6","●길어지면 → 긴급 7"],"context":[],"mic":[],"source":"emergency","page":1},{"id":2,"title":"경기 중 접속 끊김","blocks":[{"role":"캐스터 · 시작 40초 안","text":"(재경기 선언 시) 이번 라운드를 다시 시작합니다.\n같은 실험체로 다시 진행합니다."},{"role":"캐스터 · 40초 이후","text":"\n선수 접속이 끊긴 것으로 보입니다.\n경기는 그대로 진행되는데요,\n두 명으로 버텨야 하는 팀 이름 , 어떻게 봐야 할까요?"},{"role":"해설1·2 ·캐스터·자유롭게","text":"남은 두 선수의 운영 · 재접속 타이밍"},{"role":"캐스터 · 재접속하면","text":"\n선수 돌아왔습니다!"}],"notes":["●40초 재경기는 심판이 선언\n(제16조 1.1)","●버그는 재경기 사유 아님\n(제16조 2항)"],"context":[],"mic":[],"source":"emergency","page":2},{"id":3,"title":"송출·영상 문제","blocks":[{"role":"캐스터 · 화면 복귀 직후","text":"방송 화면에 잠시 문제가 있었습니다.\n시청에 불편을 드려 죄송합니다."},{"role":"캐스터","text":"그 사이 경기 상황 정리해 드리면,"},{"role":"해설2","text":"끊긴 동안 있었던 상황 정리 및 보충"},{"role":"캐스터","text":"다시 경기 화면으로 가보겠습니다."}],"notes":[],"context":[],"mic":[],"source":"emergency","page":3},{"id":4,"title":"마이크·인터뷰 연결","blocks":[{"role":"해설2 · 캐스터 마이크가 끊기면","text":"잠시 제가 이어가겠습니다."},{"role":"캐스터 · 흑영랑 해설 연결이 끊기면","text":"영랑 해설 연결이 잠시 끊긴 것 같은데요,\n현동 님은 어떻게 보셨나요?"},{"role":"캐스터 · 인터뷰 연결이 늦을 때","text":"우승팀 선수들과의 연결이\n조금 늦어지고 있는데요,\n잠시 그 사이에\n오늘 가장 기억에 남는 우승 팀의 플레이를 이야기해볼까요?"}],"notes":["●우승팀 연결\nPD가 생략 큐를 주면\n바로 총평(큐시트)"],"context":[],"mic":[],"source":"emergency","page":4},{"id":5,"title":"결과 확인 지연·정정","blocks":[{"role":"캐스터 · 결과가 늦을 때","text":"현재 경기 결과를 최종 확인하고 있습니다.\n확정되는 대로 바로 전해드리겠습니다.\n기다리는 동안\n이번 경기의 승부처, 한 번 더 짚어볼까요?"},{"role":"해설1·2 ·캐스터·자유롭게","text":"승부처 리뷰"},{"role":"캐스터 · 잘못 발표했을 때","text":"앞서 전해드린 오류 내용을 바로잡습니다.\n정확한 내용이 맞습니다.\n혼선 드려 죄송합니다."}],"notes":["●이의제기는\n경기 종료 후 5분 안,\n팀 대표가 접수 (제18조)\n→ 확정이 늦어질 수 있음"],"context":[],"mic":[],"source":"emergency","page":5},{"id":6,"title":"제재·감점 공지","blocks":[{"role":"캐스터","text":"운영진 공지 전해드립니다.\n팀 이름 선수의 위반 사항이\n확인 돼 규정에 따라 제재가 적용됩니다."},{"role":"해설1·2 ·캐스터·자유롭게","text":"순위 싸움에 주는 영향 짚기"},{"role":"캐스터","text":"그럼 경기 이어가겠습니다."}],"notes":["●공지 문구가 따로 오면\n그 문구를 그대로","●제재 기준 (제19조)\n– 지각·로비 미합류 -3점\n– 실험체 미선택 -5점\n– 로스터 미제출 -3점\n– 2차는 당일 실격\n– 경고 2회 -5점 · 3회 실격"],"context":[],"mic":[],"source":"emergency","page":6},{"id":7,"title":"중계진 토크","blocks":[{"role":"캐스터","text":"저는 오늘 장면이 가장 기억에 남는데요,\n두 분은 어떤 장면이 가장 인상 깊으셨나요?"},{"role":"캐스터","text":"오늘은 대회 우승 경험자가 많아서\n경기 수준이 확실히 다른데요,\n그중에서도 눈여겨볼 선수가 있다면 누구일까요?"},{"role":"캐스터","text":"오늘 경기 보면서 ‘나도 써봐야겠다’\n싶은 실험체 있었나요?"},{"role":"캐스터","text":"요즘 랭크에서 제일 자주 보이는 실험체는요?"},{"role":"캐스터","text":"남은 라운드에서 순위를 바꿀 수 있는\n변수는 어떤 게 있을까요?"},{"role":"캐스터","text":"누적 순위로 보면, 남은 라운드에서\n가장 치열해질 구간은 어디일까요?"},{"role":"캐스터 → 해설1","text":"혼자 같이보기 방송을 하실 때와\n오늘처럼 여럿이 함께 중계하실 때,\n신경 쓰는 부분이 어떻게 달라지나요?"},{"role":"캐스터 → 해설2","text":"직접 중계석에 앉아 보시니까,\n생각했던 것과 가장 다른 점은 뭐였나요?"}],"notes":[],"context":[],"mic":[],"source":"emergency","page":7},{"id":8,"title":"스폰서 홍보","blocks":[{"role":"캐스터 → 해설1·2","text":"잠깐 시간이 난 김에 한번 더 말씀드리면,\n오늘 대회는 공식 스폰서 터틀비치가 함께해 주고 계시죠.\n터틀비치 퀴즈 이벤트, 아직 참여 안 하셨다면 지금이 기회입니다!\n( )님?"},{"role":"해설1·2 · 호명된 분","text":"네, 화면에 나오는 QR 찍으시고 정답만 보내 주시면 끝인데요,\n맞히신 분들 중 네 분을 뽑아서\n터틀비치 이어폰과 마우스패드를 보내 드립니다!\n대회 기념 터틀비치 스페셜 세일도 열려 있는데요,\n12일 월요일 오전 11시까지니까\nQR로 접속하셔서 확인 바랍니다!"}],"notes":["●QR이 화면에 나올 때 안내","●경품 · 추첨 4명, 1인 1개\n– 리콘 배틀버즈 블랙 이어폰\n– 센스 코어 마우스패드","●스페셜 세일\n10.8(목) 18:00 ~\n10.12(월) 11:00"],"context":[],"mic":[],"source":"emergency","page":8},{"id":9,"title":"승부 예측 이벤트","blocks":[{"role":"캐스터 → 해설1·2","text":"기다리시는 동안 이벤트 소식 하나 더 전해 드릴게요.\n오늘 우승팀을 맞혀 보는 승부 예측, 아직 열려 있습니다!\n( )님?"},{"role":"해설1·2 · 호명된 분","text":"네, 방법은 어렵지 않습니다.\n화면 QR이나 라이징 공식 계정 링크에서\n우승할 것 같은 팀을 골라 주시면 되고요,\n정답 맞히신 분 중 한 분께\nbhc 뿌링클 콤보 세트 기프티콘이 갑니다!"},{"role":"캐스터","text":"1라운드 1일차 밤이면 마감이라 시간이 얼마 안 남았습니다.\n지금까지 느낌 오는 팀 있으시죠?\n그 팀으로 바로 한 표 던져 주세요!"}],"notes":["●상품 · 추첨 1명\n– bhc 뿌링클 콤보 세트 기프티콘","●마감 (1라운드 인게임 1일차 밤)","이후에는\n쓰지 않기 → 긴급 10·11"],"context":[],"mic":[],"source":"emergency","page":9},{"id":10,"title":"시청 인증 이벤트","blocks":[{"role":"캐스터 → 해설1·2","text":"끝까지 봐 주시는 분들을 중에 아직 참여 안하신 분도 계실까요?\n저희 시청 인증 이벤트도 있죠.\n( )님?"},{"role":"해설1·2 · 호명된 분","text":"네, 인증 방법은 화면 QR이나\n라이징 공식 계정 링크에서 바로 확인하실 수 있고요,\n열 분을 뽑아서 CU 3,000원 기프티콘을 드립니다!"},{"role":"캐스터","text":"클로징 전까지만 인증 남겨 주시면 됩니다.\n마지막까지 저희랑 함께해 주세요!"}],"notes":["●상품 · 추첨 10명\n– CU 3,000원 기프티콘","●마감 · 클로징 때까지"],"context":[],"mic":[],"source":"emergency","page":10},{"id":11,"title":"설문조사 이벤트","blocks":[{"role":"캐스터 → 해설1·2","text":"채팅창 고정 댓글도 한번 봐 주시면요,\n오늘 대회 시청자 설문 이벤트가 올라와 있습니다.\n( )님?"},{"role":"해설1·2 · 호명된 분","text":"네, 오늘 방송 어떠셨는지 솔직하게 남겨 주시면 되는데요.\n참여해 주신 분들 중 추첨으로\n인천 웨이브 인게임\n시즌 7 패키지 다섯 분,\n시즌 8 패키지 다섯 분께 드립니다!"},{"role":"캐스터","text":"남겨 주신 이야기는 다음 대회 준비에 꼭 반영하겠습니다.\n잠깐 시간 내서 참여해주시면 많은 도움이 되겠습니다!"}],"notes":["●경품\n– 인천 웨이브 제공\n– 시즌 7 패키지 5명\n– 시즌 8 패키지 5명","(추첨 총 10명)"],"context":[],"mic":[],"source":"emergency","page":11}],"teams":[{"id":0,"name":"Desperado","pron":"데스페라도","record":"S12부터 마스터즈 출전\n팀 최고 성적: S12 P1 세미파이널 B 6위\n최근: S12 P3 예선 Lower D 6위","story":"KEG 우승·MVP 응선생과 S11 그랜드파이널 경험자 Runatic이 한 팀\n재키(Husky)·윌리엄(Runatic) 원거리 축","players":[{"name":"Husky","pron":"허스키","tier":"이터니티 1","mmr":"9,817","games":"438","win":"24.2%","rank":"3.82","tk":"5.37","champions":["재키","케네스","하트"],"sections":[{"title":"플레이 성향","text":["대회 주 실험체: 재키"]},{"title":"공식 대회 커리어","text":["S12 P1 세미파이널 B 6위 (Desperado)\nS9 P2 녹아웃 스테이지4 5위 (OverDrive)\nS11 P1 예선 Lower B 4위 (INVINCIBLE)\nECA 2026 KR 예선 #1 D조 5위 (Jecheon iV\nPhalanX)\n제천시장배 2025 세미파이널 B조 5위\n(OverDrive)\nS11 LCQ 오픈슬롯2 A조 7위 (Neverdie)\nS12 P3 예선 Lower D 6위 (Desperado,\n9/30)"]},{"title":"스토리","text":["팀 내 최고 MMR(9,817), 재키 255판\n최근 10판 1위 5회로 폼이 가장 좋음"]},{"title":"방송·인지도","text":["커뮤니티 유명"]}]},{"name":"Runatic","pron":"루나틱","tier":"이터니티 1","mmr":"9,289","games":"546","win":"17.6%","rank":"3.97","tk":"4.13","champions":["윌리엄","로지","나딘"],"sections":[{"title":"플레이 성향","text":["대회 주 실험체: 윌리엄 function currentKey(){return `${state.tab}-${state.tab==='cue'?state.cue:state.tab==='emergency'?state.emergency:state.tab==='teams'?state.team:'all'}`;}
function rememberScroll(){state.scroll[currentKey()]=$('#main').scrollTop;}
function navigate(tab,id,keepScroll=false){rememberScroll();state.tab=tab;if(tab==='cue'&&id!=null)state.cue=Math.min(DATA.cues.length,Math.max(1,Number(id)));if(tab==='emergency'&&id!=null)state.emergency=Math.min(DATA.emergency.length,Math.max(1,Number(id)));if(tab==='teams'&&id!=null)state.team=Math.min(7,Math.max(-3,Number(id)));state.original=false;save();render();$('#main').scrollTop=keepScroll?(state.scroll[currentKey()]||0):0;}
function isMine(b){if(state.role==='전체')return false;const speaker=b.role.split('→')[0];if(speaker.startsWith('공동'))return true;if(speaker.includes('해설1·2'))return state.role.startsWith('해설')||speaker.includes(state.role);return speaker.includes(state.role);}
function isIncoming(b){return state.role!=='전체'&&b.role.includes('→')&&(b.role.split('→')[1].includes(state.role)||(state.role.startsWith('해설')&&b.role.split('→')[1].includes('해설1·2')));}
function roleName(role){if(role.startsWith('해설1·2'))return '흑영랑 · 손현동';if(role.startsWith('해설1'))return '흑영랑';if(role.startsWith('해설2'))return '손현동';if(role.startsWith('캐스터'))return '방재혁';return '';}
function refBox(title,arr){if(!arr?.length)return '';return `<section class="ref-box"><h3>${esc(title)}</h3><div class="ref-content">${arr.map(t=>`<p>${esc(t)}</p>`).join('')}</div></section>`;}
function render(){
 document.body.classList.toggle('light',state.theme==='light');document.body.classList.toggle('focus',state.focus);document.documentElement.style.setProperty('--script',state.font+'px');
 const themeButton=$('#theme-toggle'),themeLabel=state.theme==='light'?'다크 모드로 전환':'일반 모드로 전환';
 themeButton.innerHTML=icon(state.theme==='light'?'moon':'sun');themeButton.setAttribute('aria-label',themeLabel);themeButton.setAttribute('title',themeLabel);
 $$('[data-tab]').forEach(el=>{const active=el.dataset.tab===state.tab;el.classList.toggle('active',active);if(active)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');});
 const readingCard=state.tab==='cue'?DATA.cues[state.cue-1]:state.tab==='emergency'?DATA.emergency[state.emergency-1]:null;
 $('#main').classList.toggle('has-oap',!state.original&&Boolean(readingCard&&(readingCard.oap?.length||readingCard.notes.length)));
 renderSidebar();
 if(state.tab==='cue')renderScript(DATA.cues[state.cue-1]);else if(state.tab==='emergency')renderEmergency();else if(state.tab==='schedule')renderSchedule();else renderTeams();
 renderTeamWorkspace();renderFooter();hydrateIcons();
}
function navLink(label,num,attrs,active,sub='',mine=false){return `<button class="cue-link ${active?'active':''}" ${active?'aria-current="true"':''} ${attrs}><span class="cue-num">${esc(num)}</span><span class="cue-link-text">${esc(label)}${sub?`<span class="cue-link-time">${esc(sub)}</span>`:''}</span>${mine?'<span class="mine-dot" title="나의 대사 있음"></span>':''}</button>`;}
function renderSidebar(){
 let html='',title='',count='';
 if(state.tab==='cue'){
  title='진행 순서';count=DATA.cues.length+'장';
  for(const g of DATA.groups){html+=`<div class="sidebar-group"><span>${esc(g.title)}</span></div>`;
   html+=DATA.cues.filter(c=>c.id>=g.start&&c.id<=g.end).map(c=>{
    const team=c.team!=null?DATA.teams[c.team]:null;
    return navLink(c.title,pad(c.id),`data-cue="${c.id}"`,state.cue===c.id,team?team.name:'');
   }).join('');}
 }else if(state.tab==='emergency'){
  title='상황 선택';count=DATA.emergency.length+'개';html=DATA.emergency.map(c=>navLink(c.title,c.id,`data-emergency="${c.id}"`,state.emergency===c.id)).join('');
  html+=`<div class="divider"></div>${navLink('보던 진행 큐로 복귀','↩','data-action="resume"',false,DATA.cues[state.cue-1].title)}`;
 }else if(state.tab==='schedule'){
  title='방송 순서';count='29개';html=DATA.schedule.map(r=>navLink(r.title,pad(r.id),`data-schedule-row="${r.id}"`,false,r.time)).join('');
 }else{
  title='팀 선택';count='8팀';html=navLink('8팀 한눈에 보기','▦','data-team="-1"',state.team===-1)+navLink('전체 선수 요목표','▤','data-team="-2"',state.team===-2)+navLink('토크 뱅크','✦','data-team="-3"',state.team===-3)+'<div class="divider"></div>';
  html+=DATA.teams.map(t=>navLink(t.name,pad(t.id+1),`data-team="${t.id}"`,state.team===t.id,t.name!==t.pron?t.pron:'')).join('');
 }
 $('#sidebar-title').textContent=title;$('#sidebar-count').textContent=count;$('#sidebar-items').innerHTML=html;
 const selected=$('#sidebar-items .cue-link.active');if(selected)selected.scrollIntoView?.({block:'nearest'});
}
function micStrip(text){
 const off=text.includes('OFF');
 return `<div class="mic-strip${off?' off':''}"><span class="mic-icon" aria-hidden="true">${off?'🔇':'🎙️'}</span><strong>${esc(text)}</strong></div>`;
}
function scriptBody(card){
 const visible=state.mine&&state.role!=='전체'?card.blocks.filter(b=>isMine(b)||isIncoming(b)):card.blocks;
 let body=card.mic.filter(t=>!t.includes('OFF')).map(micStrip).join('');
 body+=`<div class="script-list">${visible.length?visible.map(b=>`<section class="speech ${isMine(b)?'mine':''} ${isIncoming(b)?'incoming':''} ${b.role.split('→')[0].includes('해설1')||b.role.startsWith('공동')?'commentator-one':''}"><div class="speech-role"><span>${esc(b.role)}</span><span class="role-name">${esc(roleName(b.role))}</span>${isMine(b)?'<span class="speech-hint">나의 대사</span>':isIncoming(b)?'<span class="speech-hint">받는 큐</span>':''}</div><div class="speech-text">${esc(b.text)}</div></section>`).join(''):`<div class="empty">이 카드에는 선택한 역할의 대사가 없습니다.<br><button class="icon-btn small-btn" style="margin-top:15px" data-action="mine">전체 대사 보기</button></div>`}</div>`;
 body+=card.mic.filter(t=>t.includes('OFF')).map(micStrip).join('');
 return body;
}
function scriptWithOap(card){
 const oap=card.oap||[];
 if(!oap.length&&!card.notes.length)return scriptBody(card);
 return `<div class="card-layout"><div class="card-script">${scriptBody(card)}</div><aside class="oap-reference" aria-label="방송 화면과 진행 참고"><h2>${oap.length?'방송 화면 · OAP':'진행 참고'}</h2><div class="oap-gallery">${oap.map((item,index)=>`<figure class="oap-figure"><button class="oap-thumb" data-oap="${card.source}:${card.id}:${index}" aria-label="${esc(item.label)} 크게 보기"><img src="${assetUrl(item.asset)}" width="${item.width}" height="${item.height}" alt="${esc(item.label)}" loading="lazy"></button><figcaption>${esc(item.label)}<span>클릭하여 확대 ↗</span></figcaption></figure>`).join('')}</div>${card.notes.length?`<div class="oap-notes">${card.notes.map(note=>`<p>${esc(note)}</p>`).join('')}</div>`:''}</aside></div>`;
}
function openOap(value){
 const [source,id,index]=value.split(':');const card=(source==='cue'?DATA.cues:DATA.emergency).find(c=>c.id===Number(id));
 const item=card?.oap?.[Number(index)];if(!item)return;
 showInfo(item.label,`<img class="oap-full" src="${assetUrl(item.asset)}" width="${item.width}" height="${item.height}" alt="${esc(item.label)}"><div class="document-tools">${sourceLink(source,card.page,'PDF 해당 카드')}</div>`);
 $('#info-dialog').classList.add('oap-dialog');$('#info-content').scrollTop=0;
}
function extras(card){
 let refs=refBox('참고 자료',card.context);
 if(card.team!=null)refs+=`<button class="resume-btn" data-reference-team="${card.team}">${esc(DATA.teams[card.team].name)} · 팀 정보·메모 보기 →</button>`;
 if(card.source==='emergency'&&card.id===1)refs+=`<div class="row wrap"><button class="icon-btn small-btn" data-emergency="6">제재 공지</button><button class="icon-btn small-btn" data-emergency="7">대기 중 토크</button></div>`;
 if((card.source==='emergency'&&card.id===4)||(card.source==='cue'&&card.title.startsWith('우승팀 인터뷰')))refs+=`<button class="icon-btn small-btn" data-cue="${DATA.cues.find(c=>c.title==='총평').id}">PD 인터뷰 생략 큐 → 총평</button>`;
 if(card.source==='emergency'&&card.id===7)refs+=`<button class="icon-btn small-btn" data-team="-3">팀·선수 토크 뱅크 보기</button>`;
 if(card.source==='emergency'&&card.id===9)refs+=`<div class="row wrap"><button class="icon-btn small-btn" data-emergency="10">긴급 10 · 시청 인증</button><button class="icon-btn small-btn" data-emergency="11">긴급 11 · 설문조사</button></div>`;
 return `<details class="reading-extras"><summary>참고 메모 · 원본 PDF</summary>${refs}<div class="document-tools"><button class="icon-btn small-btn" data-action="${state.original?'read':'original'}">${state.original?'대본 보기':'원문 보기'}</button>${sourceLink(card.source,card.page,'PDF 열기')}</div>${notesBox(card)}<p class="end-note">원본 ${card.page}쪽</p></details>`;
}
function originalBody(key,page){return `<div class="original-tools">${sourceLink(key,page,'PDF 해당 페이지 열기')}<button class="icon-btn small-btn" data-action="zoom">원문 확대 / 맞춤</button></div><div class="source-zoom" id="source-zoom"><img class="source-image" src="${assetUrl(`${key}-${page}.webp`)}" alt="${esc(DATA.files[key])} ${page}쪽 원본 화면"></div><p class="source-label">원문 ${page}쪽 · PDF의 배치와 문구를 그대로 확인합니다.</p>`;}
function toolbar(card){return `<div class="reader-controls"><div class="reader-options"><label for="role-current">내 역할</label><select id="role-current" aria-label="강조할 역할">${['해설1','해설2','캐스터','전체'].map(r=>`<option value="${r}" ${r===state.role?'selected':''}>${r==='전체'?'전체 역할':roleName(r)+' · '+r}</option>`).join('')}</select><div class="font-tools"><button data-action="font-smaller" aria-label="글자 작게">−</button><output id="font-size">${state.font}</output><button data-action="font-larger" aria-label="글자 크게">＋</button></div></div><button class="read-all" data-action="mine" aria-pressed="${state.mine}" ${state.role==='전체'?'disabled':''}>${state.mine?'전체 대사 보기':'내 대사만 보기'}</button></div>`;}
function notesBox(card){const key=card.source+'-'+card.id;return `<details class="notes-detail"><summary>개인 메모 ${state.notes[key]?'· 저장된 메모 있음':''}</summary><textarea data-note="${key}" aria-label="이 카드에 대한 개인 메모" placeholder="발음, 순서, 운영 공지 등 필요한 내용을 적어 두세요.">${esc(state.notes[key]||'')}</textarea><small>이 브라우저에만 저장됩니다.</small></details>`;}
function renderScript(card){
 $('#main').innerHTML=`<div class="reading-head"><span class="reading-meta">${esc(card.group)} · ${esc(card.time)} 예정</span><span class="card-counter">${card.id} / ${DATA.cues.length}</span></div><div class="title-row"><h1 class="page-title">${esc(card.title)}</h1><button class="icon-btn small-btn mobile-settings" data-action="timeline">목록</button></div><div class="mobile-reference-tools"><button class="icon-btn small-btn" data-action="open-reference">팀 정보 · 메모</button></div>${toolbar(card)}${state.original?originalBody('cue',card.page):scriptWithOap(card)}${extras(card)}`;
}
function renderEmergency(){
 const card=DATA.emergency[state.emergency-1];
 $('#main').innerHTML=`<details class="emergency-mobile-list"><summary>다른 긴급 상황 선택</summary><div class="emergency-grid">${DATA.emergency.map(c=>`<button class="emergency-choice ${c.id===card.id?'active':''}" data-emergency="${c.id}"><b>${c.id}</b><span>${esc(c.title)}</span></button>`).join('')}</div></details><div class="reading-head"><span class="reading-meta">긴급 상황</span><span class="card-counter">${card.id} / ${DATA.emergency.length}</span></div><h1 class="page-title">${esc(card.title)}</h1><div class="mobile-reference-tools"><button class="icon-btn small-btn" data-action="open-reference">팀 정보 · 메모</button></div>${toolbar(card)}${state.original?originalBody('emergency',card.page):scriptWithOap(card)}${extras(card)}`;
}
function scheduleClass(row){
 if(row.title==='오프닝 영상 시작')return 'milestone milestone-opening';
 if(row.title==='팀 소개 1')return 'milestone milestone-teams';
 if(row.phase==='break')return 'milestone milestone-break';
 if(row.title==='우승팀 발표')return 'milestone milestone-winner';
 if(row.title.includes('최종 결과 확인'))return 'milestone milestone-results';
 if(/[1-4]R 경기 준비/.test(row.title))return 'milestone milestone-round';
 if(/[1-4]R 경기 중계/.test(row.title))return 'schedule-live';
 return '';
}
function renderSchedule(){
 const filters=[['all','전체'],['opening','오프닝'],['1R','1R'],['2R','2R'],['break','쉬는 시간'],['3R','3R'],['4R','4R'],['ending','시상·클로징']];
 const rows=DATA.schedule.filter(r=>state.scheduleFilter==='all'||r.phase===state.scheduleFilter);
 $('#main').innerHTML=`<h1 class="page-title">전체 방송 큐시트</h1><p class="page-sub">${esc(DATA.scheduleMeta.start)}–${esc(DATA.scheduleMeta.end)} · ${esc(DATA.scheduleMeta.duration)} · 4라운드 포인트제<br>시간은 예정 기준입니다. 실제 진행은 운영 승인과 PD GO를 따릅니다.</p><div class="document-tools"><button class="icon-btn small-btn ${!state.original?'selected':''}" data-action="read">항목별 보기</button><button class="icon-btn small-btn ${state.original?'selected':''}" data-action="original">원문 보기</button>${sourceLink('schedule')}</div>${state.original?originalBody('schedule',1):`<div class="schedule-select">${filters.map(([id,t])=>`<button data-filter="${id}" class="${state.scheduleFilter===id?'active':''}">${t}</button>`).join('')}</div><div class="schedule-list">${rows.map(r=>`<article class="schedule-row ${scheduleClass(r)} ${r.cards.includes(state.cue)?'match':''}" id="schedule-row-${r.id}"><div class="schedule-clock"><time class="mono">${r.time}</time><small>${r.duration} · #${pad(r.id)}</small></div><div class="schedule-info"><h3>${esc(r.title)}</h3><div class="row wrap"><span class="pill">${esc(r.screen)}</span><span class="pill ${r.audio.startsWith('OFF')?'':'accent'}">${esc(r.audio)}</span></div><p class="schedule-check">${esc(r.check)}</p>${r.cards.map(id=>`<button class="related-cue" data-cue="${id}">${pad(id)} ${esc(DATA.cues[id-1].title)} ↗</button>`).join('')}</div></article>`).join('')}</div><p class="end-note">큐시트 항목과 진행 큐카드를 연결했습니다. 같은 예정 구간 안의 카드별 실제 시작 시각은 현장 진행에 따릅니다.</p>`}`;
}
function teamTabs(){return `<div class="team-pills"><button data-team="-1" class="${state.team===-1?'active':''}">8팀 보기</button><button data-team="-2" class="${state.team===-2?'active':''}">선수 요목표</button><button data-team="-3" class="${state.team===-3?'active':''}">토크 뱅크</button>${DATA.teams.map(t=>`<button data-team="${t.id}" class="${state.team===t.id?'active':''}">${esc(t.pron)}</button>`).join('')}</div>`;}
function tierClass(tier){return tier.includes('이터니티')?'eternity':tier.includes('데미갓')?'demigod':'mithril';}
function tierBadge(tier){return `<span class="tier-badge ${tierClass(tier)}"><span class="rank-diamond" aria-hidden="true"></span>${esc(tier)}</span>`;}
function careerLines(text){
 const lines=[];let balance=0;
 for(const raw of text.join('\n').split('\n')){const line=raw.trim();if(!line)continue;
  if(lines.length&&(balance>0||line.startsWith('(')))lines[lines.length-1]+=' '+line;else lines.push(line);
  balance+=(line.match(/\(/g)||[]).length-(line.match(/\)/g)||[]).length;
 }
 return lines;
}
function playerSection(s){
 const career=s.title==='공식 대회 커리어';
 const content=career?`<ul class="career-list">${careerLines(s.text).map(t=>`<li>${esc(t).replace(/준우승|우승|MVP/g,match=>`<strong>${match}</strong>`)}</li>`).join('')}</ul>`:s.text.map(t=>`<p>${esc(t)}</p>`).join('');
 return `<section class="player-section${career?' career':''}"><h4>${esc(s.title)}</h4>${content}</section>`;
}

 <div class="player-rank ${tierClass(p.tier)}"><span class="rank-label">시즌 12 티어</span>${tierBadge(p.tier)}</div>
 <section class="player-section main-champions"><h4>주력 실험체 <small>시즌 12 랭크</small></h4><div class="champions">${p.champions.map(c=>`<span>${esc(c)}</span>`).join('')}</div></section>
 ${p.sections.filter(s=>s.title==='공식 대회 커리어').map(playerSection).join('')}
 ${p.sections.filter(s=>s.title!=='공식 대회 커리어').map(playerSection).join('')}
 <div class="stats" aria-label="시즌 12 랭크 세부 기록">${[['MMR',p.mmr],['판수',p.games],['승률',p.win],['평균 순위',p.rank],['평균 TK',p.tk]].map(([a,b])=>`<div class="stat"><span>${a}</span><b class="mono">${esc(b)}</b></div>`).join('')}</div>
 </article>`;}

 if(state.team===-1){body=`<div class="team-overview">${DATA.teams.map(t=>`<button class="team-tile" data-team="${t.id}"><span class="team-tile-head"><span class="team-code">T${pad(t.id+1)}</span><strong>${esc(t.name)}</strong>${t.name!==t.pron?`<span class="team-pron">${esc(t.pron)}</span>`:''}</span><span class="roster">${t.players.map(p=>`<span class="roster-player"><span>${esc(p.name)}</span>${tierBadge(p.tier)}</span>`).join('')}</span><span class="team-tile-link">선수·커리어 보기 →</span></button>`).join('')}</div>`;}
 else if(state.team===-2){title='전체 선수 요목표';sub='팀명을 누르면 해당 팀의 상세 정보로 이동합니다.';body=`<div class="roster-groups">${DATA.teams.map(t=>`<section class="roster-group team-tone-${t.id}" aria-labelledby="roster-team-${t.id}">
 <h2 class="roster-group-title" id="roster-team-${t.id}"><button data-team="${t.id}"><span>T${pad(t.id+1)}</span><b>${esc(t.name)}</b><span class="group-open" aria-hidden="true">↗</span></button></h2>
 <table class="roster-table"><colgroup><col class="col-player"><col class="col-tier"><col class="col-champions"><col class="col-stats"></colgroup><thead><tr><th scope="col">선수 / 발음</th><th scope="col">티어</th><th scope="col">주력 실험체</th><th scope="col">시즌 12 기록</th></tr></thead><tbody>${t.players.map(p=>`<tr class="roster-table-player"><td class="roster-name"><strong>${esc(p.name)}</strong>${p.pron?`<small>${esc(p.pron)}</small>`:''}</td><td class="roster-tier">${tierBadge(p.tier)}</td><td class="roster-champions" data-label="주력 실험체">${p.champions.map(c=>`<span>${esc(c)}</span>`).join('')}</td><td class="roster-stats" data-label="시즌 12 기록"><dl>${[['MMR',p.mmr],['판수',p.games],['승률',p.win],['평균 순위',p.rank],['평균 TK',p.tk]].map(([label,value])=>`<div><dt>${label}</dt><dd>${esc(value)}</dd></div>`).join('')}</dl></td></tr>`).join('')}</tbody></table></section>`).join('')}</div>`;}
 else if(state.team===-3){title='토크 뱅크';sub='대기·딜레이 중 꺼내 볼 수 있는 선수 이야기와 겹치는 주력 실험체';page=10;body=`<h2 style="font-size:17px;margin-top:22px">주목할 선수</h2>${DATA.notable.map(([p,t,s])=>`<article class="talk-item"><div class="row spread"><h3>${esc(p)}</h3><button data-team="${t}">${esc(DATA.teams[t].name)} ↗</button></div><p>${esc(s)}</p></article>`).join('')}<h2 style="font-size:17px;margin:25px 0 8px">주력 실험체 겹침</h2><p class="page-sub">시즌 12 랭크 상위 3개 기준 · 여러 선수의 공통 주력 실험체 · 예선 픽 수와 별도입니다.</p>${Object.entries(DATA.overlaps).sort((a,b)=>b[1].length-a[1].length).map(([c,ps])=>`<article class="talk-item"><div class="row spread"><h3>${esc(c)}</h3></div><p>${ps.map(p=>`<button data-team="${p.team}">${esc(p.name)}</button>`).join(' · ')}</p></article>`).join('')}<button class="icon-btn" data-emergency="7" style="margin-top:14px">긴급 7 · 중계진 토크 질문 열기</button>`;}
 else{const t=DATA.teams[state.team];title=t.name;page=t.page;body=`<div class="team-summary">${refBox('팀 기록',t.record?[t.record]:[])}${refBox('이야깃거리',t.story?[t.story]:[])}</div><div class="players-heading"><h2>선수 정보</h2><button class="icon-btn small-btn" data-cue="${DATA.cues.find(c=>c.team===t.id).id}">팀 소개 대사 ↗</button></div><div class="players">${t.players.map(playerCard).join('')}</div>`;}
 const heading=state.team>=0?`<header class="team-banner"><span class="team-banner-label">IGA RISING · 결승 출전 팀 ${state.team+1} / 8</span><div class="team-banner-title"><span class="team-code">T${pad(state.team+1)}</span><h1 class="page-title">${esc(title)}</h1></div>${DATA.teams[state.team].pron!==title?`<p class="team-banner-pron">${esc(DATA.teams[state.team].pron)}</p>`:''}</header>`:`<h1 class="page-title">${esc(title)}</h1><p class="page-sub">${esc(sub)}</p>`;
 $('#main').innerHTML=`${heading}${teamTabs()}<div class="document-tools"><button class="icon-btn small-btn ${!state.original?'selected':''}" data-action="read">읽기 화면</button><button class="icon-btn small-btn ${state.original?'selected':''}" data-action="original">원문 보기</button>${sourceLink('teams',page)}</div>${state.original?originalBody('teams',page):body}`;
}
function renderFooter(){
 let html='';
 if(state.tab==='cue')html=`<button class="icon-btn" data-action="prev" ${state.cue===1?'disabled':''}>← 이전</button><span class="nav-counter">${state.cue} / ${DATA.cues.length}</span><button class="icon-btn primary" data-action="next" ${state.cue===DATA.cues.length?'disabled':''}>다음 큐 →</button>`;
 else if(state.tab==='emergency')html=`<button class="icon-btn" data-action="resume">← 대본으로 돌아가기</button><div class="row"><button class="icon-btn small-btn" data-action="prev" aria-label="이전 긴급 카드" ${state.emergency===1?'disabled':''}>이전</button><button class="icon-btn small-btn" data-action="next" aria-label="다음 긴급 카드" ${state.emergency===DATA.emergency.length?'disabled':''}>다음</button></div>`;
 else html=`<button class="icon-btn" data-action="resume">← 대본으로 돌아가기</button><span class="nav-counter">${pad(state.cue)} · ${esc(DATA.cues[state.cue-1].title)}</span>`;
 $('#bottom-nav').innerHTML=html;
}
function showInfo(title,html){$('#info-dialog').classList.remove('oap-dialog');$('#info-title').textContent=title;$('#info-content').innerHTML=html;if(!$('#info-dialog').open)$('#info-dialog').showModal();}
function renderTeamWorkspace(){
 const visible=['cue','emergency'].includes(state.tab);
 const expanded=visible&&state.referenceOpen&&!state.focus;
 document.body.classList.toggle('with-team-panel',visible);
 document.body.classList.toggle('reference-open',expanded);
 const panel=$('#team-workspace');panel.hidden=!visible;panel.inert=!expanded;panel.setAttribute('aria-hidden',String(!expanded));
 const toggle=$('#reference-toggle'),label=expanded?'팀 정보·메모 접기':'팀 정보·메모 펼치기';
 toggle.hidden=!visible;toggle.innerHTML=icon(expanded?'right':'left');toggle.setAttribute('aria-expanded',String(expanded));toggle.setAttribute('aria-label',label);toggle.setAttribute('title',label);
 if(!visible)return;
 const t=DATA.teams[state.referenceTeam];
 // Keep the independent information scroll and textarea selection when only the cue changes.
 if(panel.dataset.renderedTeam===String(t.id))return;
 $('#reference-team').innerHTML=DATA.teams.map(team=>`<option value="${team.id}">${pad(team.id+1)} · ${esc(team.name)}</option>`).join('');
 $('#reference-team').value=String(t.id);
 $('#team-reference-body').innerHTML=`${t.pron!==t.name?`<p class="reference-pron">${esc(t.pron)}</p>`:''}<div class="team-summary">${refBox('팀 기록',t.record?[t.record]:[])}${refBox('이야깃거리',t.story?[t.story]:[])}</div><div class="players">${t.players.map(playerCard).join('')}</div><div class="document-tools">${sourceLink('teams',t.page)}</div>`;
 $('#team-reference-body').scrollTop=0;
 $('#team-note-name').textContent=t.name;
 $('#team-note').dataset.note='team-'+t.id;
 $('#team-note').value=state.notes['team-'+t.id]||'';
 $('#team-note-status').textContent=storageFailed?'저장하지 못했어요. 메모를 복사해 주세요.':'이 브라우저에 자동 저장됩니다.';
 panel.dataset.renderedTeam=String(t.id);
}
function setReferenceOpen(open){state.referenceOpen=Boolean(open);if(open){state.focus=false;document.body.classList.remove('focus');}save();renderTeamWorkspace();}
function selectReferenceTeam(id){if(!Number.isInteger(id)||!DATA.teams[id])return;state.referenceTeam=id;setReferenceOpen(true);}
function help(){showInfo('보기 설정',`<div class="settings-row"><label for="role-mobile">나의 역할</label><select id="role-mobile">${['해설1','해설2','캐스터','전체'].map(r=>`<option value="${r}" ${r===state.role?'selected':''}>${r==='전체'?'전체 역할':roleName(r)+' · '+r}</option>`).join('')}</select></div><div class="settings-row"><label>글자 크기</label><button class="icon-btn" data-action="font-smaller">−</button><span id="help-font">${state.font}px</span><button class="icon-btn" data-action="font-larger">＋</button></div><div class="settings-row"><label>화면</label><button class="icon-btn" data-action="theme">밝게 / 어둡게</button><button class="icon-btn" data-action="focus">대본만 크게 보기</button></div><div class="divider"></div><div class="help-grid"><kbd>← / →</kbd><span>이전 / 다음 카드</span></div><div class="divider"></div><p class="muted" style="font-size:14px">해설 1 대사는 파란색으로 표시됩니다. 선택한 역할에는 ‘나의 대사’ 표시가 붙습니다. 진행 위치와 메모는 이 브라우저에 저장됩니다. 카드가 시간에 따라 자동으로 넘어가지는 않습니다.</p><div class="row wrap" style="margin-top:24px"><button class="icon-btn pdf-button" data-action="pdfs">원본 PDF</button><button class="icon-btn" data-cue="1" data-dismiss-info="true">처음부터 보기</button></div>`);}
function pdfs(){showInfo('원본 PDF 4개',Object.entries(DATA.files).map(([k,v])=>`<div class="pdf-item">${icon('file')}<div><b>${esc(v)}</b><small>${DATA.pageCounts[k]}쪽</small></div><div class="row">${sourceLink(k,1,'열기')}<a class="icon-btn small-btn pdf-button" href="${assetUrl(k+'.pdf')}" download="${esc(v)}">${icon('download')}저장</a></div></div>`).join('')+'<p class="end-note">읽기 화면에 옮긴 내용과 원본을 함께 확인할 수 있습니다.</p>');}
function timeline(){showInfo('진행 타임라인',DATA.groups.map(g=>`<div class="sidebar-group">${esc(g.title)}</div>${DATA.cues.filter(c=>c.id>=g.start&&c.id<=g.end).map(c=>navLink(c.title,pad(c.id),`data-cue="${c.id}" data-dismiss-info="true"`,state.cue===c.id,c.time+' 예정 구간')).join('')}`).join(''));}
function gotoSchedule(id){navigate('schedule');state.scheduleFilter='all';renderSchedule();$('#schedule-row-'+id)?.scrollIntoView?.({block:'start'});}
function advance(delta){if(state.tab==='cue')navigate('cue',state.cue+delta);else if(state.tab==='emergency')navigate('emergency',state.emergency+delta);}
const actions={help,pdfs,timeline,resume:()=>navigate('cue',state.cue,true),next:()=>advance(1),prev:()=>advance(-1),focus:()=>{state.focus=!state.focus;render();toast(state.focus?'대본만 크게 표시합니다.':'제목 목록을 표시합니다.');},theme:()=>{state.theme=state.theme==='light'?'dark':'light';state.themeChosen=true;save();render();},'font-smaller':()=>changeFont(-2),'font-larger':()=>changeFont(2),mine:()=>{state.mine=!state.mine;state.original=false;render();},original:()=>{state.original=true;render();},read:()=>{state.original=false;render();},zoom:()=>$('#source-zoom')?.classList.toggle('zoomed')};
actions['toggle-reference']=()=>setReferenceOpen(state.focus||!state.referenceOpen);
actions['open-reference']=()=>{setReferenceOpen(true);$('#reference-team').focus({preventScroll:true});};
actions['close-reference']=()=>{setReferenceOpen(false);$('#reference-toggle').focus({preventScroll:true});};
function changeFont(delta){state.font=Math.max(18,Math.min(36,state.font+delta));save();document.documentElement.style.setProperty('--script',state.font+'px');if($('#font-size'))$('#font-size').textContent=state.font;if($('#help-font'))$('#help-font').textContent=state.font+'px';}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-action],[data-tab],[data-cue],[data-emergency],[data-team],[data-reference-team],[data-oap],[data-close],[data-filter],[data-schedule-row]');if(!t)return;
 if(t.disabled)return;
 if(t.dataset.dismissInfo)$('#info-dialog').close();
 if(t.dataset.close){$('#'+t.dataset.close).close();return;}
 if(t.dataset.oap){openOap(t.dataset.oap);return;}
 if(t.dataset.referenceTeam!=null){selectReferenceTeam(Number(t.dataset.referenceTeam));return;}
 if(t.dataset.cue){navigate('cue',Number(t.dataset.cue));return;}
 if(t.dataset.emergency){navigate('emergency',Number(t.dataset.emergency));return;}
 if(t.dataset.team!=null){navigate('teams',Number(t.dataset.team));return;}
 if(t.dataset.tab){navigate(t.dataset.tab,null,true);return;}
 if(t.dataset.filter){state.scheduleFilter=t.dataset.filter;renderSchedule();return;}
 if(t.dataset.scheduleRow){gotoSchedule(Number(t.dataset.scheduleRow));return;}
 if(t.dataset.action&&actions[t.dataset.action])actions[t.dataset.action]();
});
document.addEventListener('change',e=>{if(e.target.id==='reference-team'){selectReferenceTeam(Number(e.target.value));return;}if(['role','role-mobile','role-current'].includes(e.target.id)){state.role=e.target.value;save();render();if($('#role-mobile'))$('#role-mobile').value=state.role;}});
document.addEventListener('input',e=>{if(e.target.dataset.note){state.notes[e.target.dataset.note]=e.target.value;save();if(e.target.id==='team-note')$('#team-note-status').textContent=storageFailed?'저장하지 못했어요. 메모를 복사해 주세요.':'자동 저장됨 · 이 브라우저';}});
document.addEventListener('keydown',e=>{
 if(e.defaultPrevented||e.isComposing||e.ctrlKey||e.metaKey||e.altKey||e.shiftKey)return;
 if(e.target.closest('input,textarea,select,[contenteditable="true"]'))return;
 if($('#info-dialog').open)return;
 if(['ArrowLeft','ArrowRight'].includes(e.key)&&['cue','emergency'].includes(state.tab)){e.preventDefault();advance(e.key==='ArrowRight'?1:-1);}
});
for(const d of $$('.modal'))d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}});
render();
if(storageFailed)toast('이 브라우저에서는 진행 위치 저장이 제한됩니다.');
</script>
</body></html>
